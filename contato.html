<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Contato</title>
</head>
<body>
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"> 
    <div class="container d-flex align-items-center">
        
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg>
            <span class="fs-4">Portfólio</span>
        </a>

        <nav>
            <ul class="nav nav-pills">
              <li class="nav-item">
                  <a href="index.html" class="nav-link" aria-current="page">Inicio</a>
              </li>
            <li><a href="sobre.html" class="nav-link">Sobre</a></li>
            <li><a href="habilidades.html" class="nav-link">Habilidades</a></li>
            <li><a href="cursos.html" class="nav-link">Cursos</a></li>
            <li><a href="contato.html" class="btn btn-success">Contato</a></li>
            </ul>
        </nav>
    </div>
    </header>
    <main>
      <section>
        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required class="form-control">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required class="form-control">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" required class="form-control"></textarea>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </section>
    </main>
    <div class="container">
      <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        </ul>
        <p class="text-center text-body-secondary">&copy; 2025 Company, Inc</p>
      </footer>
    </div>  
</body>
</html>
