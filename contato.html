<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Contato</title>
</head>
<body>
    <header class="py-3 mb-4 border-bottom"> 
        <nav class="navbar navbar-expand-md container">            
            <a href="index.html" class="navbar-brand d-flex align-items-center text-dark text-decoration-none">
                <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                    <use xlink:href="#bootstrap"></use>
                </svg>
                <span class="fs-4">Portfólio</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meuMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="meuMenu">
                <ul class="nav nav-pills mt-3 mt-md-0 align-items-center">
                    <li class="nav-item"><a href="index.html" class="nav-link" aria-current="page">Inicio</a></li>
                    <li class="nav-item"><a href="sobre.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="habilidades.html" class="nav-link">Habilidades</a></li>
                    <li class="nav-item"><a href="cursos.html" class="nav-link">Cursos</a></li>
                    <li class="nav-item"><a href="contato.html" class="btn btn-success">Contato</a></li>
                </ul>
            </div>            
        </nav>
    </header>
    <main>
      <section>
        <div id="mensagem-alerta"></div>
        <form id="form-contato">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" class="form-control" >
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu E-mail" class="form-control">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" class="form-control"></textarea>
            <div id="contador" class="text-end text-muted small mt-1">0 / 250 caracteres</div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </section>
    </main>
    <div class="container">
      <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        </ul>
        <p class="text-center text-body-secondary">&copy; 2026 - Arthur</p>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="validacao.js"></script>  
</body>
</html>
